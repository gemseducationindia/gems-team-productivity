# Every 30 min Mon-Sat 9:00-19:00 IST, plus on demand from the dashboard's Refresh button (Corporate login) or the Actions tab.
# Needs the CRM_TOKEN secret ("key:secret" of the Frappe API user). GitHub can start scheduled runs a few minutes late.
name: Refresh
on:
  schedule:
    - cron: "30 3 * * 1-6"         # 09:00 IST
    - cron: "0,30 4-13 * * 1-6"    # 09:30 to 19:00 IST
  workflow_dispatch:
concurrency: {group: refresh, cancel-in-progress: false}
permissions: {contents: write}
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install cryptography==43.0.3
      - run: python build.py productivity.json
        env: {CRM_TOKEN: "${{ secrets.CRM_TOKEN }}"}
      - run: python business.py business.json
        env: {CRM_TOKEN: "${{ secrets.CRM_TOKEN }}"}
      - run: python publish.py productivity.json _site business.json
      - name: Publish to gh-pages
        run: |
          cd _site
          git init -q -b gh-pages
          git config user.name "GEMS Productivity bot"; git config user.email "gemseducationindia@users.noreply.github.com"
          git add -A; git commit -q -m "Refresh $(TZ=Asia/Kolkata date '+%-d %b %Y %H:%M IST')"
          # one commit only, replaced on every run, so encrypted copies don't pile up in the history
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages
